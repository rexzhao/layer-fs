[package]
name = "fs-workspace"
description = "Workspaces, snapshots, commits and branches over a CAS store (ADR-006)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Test-only seams for the offline GC (P2b-6 §7): skip visiting a declared root, force an id into
# the free set. Off by default, so a production build cannot lie about the root set.
gc-test-hooks = []

[dependencies]
cas-core.workspace = true
cas-store.workspace = true
fs-namespace.workspace = true
fs-snapshot.workspace = true
fs-overlay.workspace = true
rusqlite.workspace = true
blake3.workspace = true

[dev-dependencies]
# Self-reference so `cargo test -p fs-workspace` compiles the GC injection seams (ADR-008 §5.4,
# P2b-6 §7). Same precedent as `cas-store`'s `crash-points`: the feature is off for every
# consumer, and on for this crate's own tests, so the F counter-example actually runs.
fs-workspace = { path = ".", features = ["gc-test-hooks"] }
