[workspace]
resolver = "2"
members = [
    "crates/fs-semantics",
    "crates/fs-windows",
    "crates/fs-winfsp",
    "crates/fs-layerfs",
    "crates/fs-cli",
    "crates/chunk-bench",
    "crates/fs-dedup",
    "upstream/crates/layerfs-win32-host",
    "upstream/crates/layerfs-telemetry",
    "upstream/crates/layerfs-content",
    "upstream/crates/layerfs-storage",
    "upstream/crates/layerfs-history",
    "upstream/crates/layerfs-persistence",
    "upstream/crates/layerfs-overlay",
    "upstream/crates/layerfs-workspace",
    "upstream/crates/layerfs-bridge",
    "upstream/crates/layerfs-store-service",
    "upstream/crates/layerfs-project",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
fs-semantics = { path = "crates/fs-semantics" }
fs-windows = { path = "crates/fs-windows" }
fs-winfsp = { path = "crates/fs-winfsp" }
fs-layerfs = { path = "crates/fs-layerfs" }
blake3 = "1.8.7"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.test]
opt-level = 1

[profile.test.package.zstd-sys]
opt-level = 3
