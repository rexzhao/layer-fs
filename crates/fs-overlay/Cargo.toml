[package]
name = "fs-overlay"
description = "Per-workspace overlay backend: an overlay file composed over a snapshot base (ADR-006)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The value-domain rule for attributes lives here (zero-dependency, shared with the frontend). This crate is the layer
# closest to the disk, so it must refuse a derived bit itself rather than trusting a caller: that is the fourth call site
# of one function, not a fourth copy of one rule.
fs-semantics.workspace = true
cas-core.workspace = true
cas-store.workspace = true
fs-namespace.workspace = true
fs-snapshot.workspace = true
rusqlite.workspace = true

[features]
# Test-only seams for the tree contract (P3-2 G2): the `live` marker of a tombstoned row is invisible through
# `TreeRead` by design, so "the row is still there" needs a seam that production never gets.
gc-test-hooks = []

[dev-dependencies]
# Self-reference so this crate's own tests compile with the seam (same precedent as `cas-store`'s `crash-points`).
fs-overlay = { path = ".", features = ["gc-test-hooks"] }
