name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy (Windows adapter, bridge, dedup, CLI, Win32 host)
        run: >
          cargo clippy --no-deps
          -p fs-semantics
          -p fs-windows
          -p fs-winfsp
          -p fs-layerfs
          -p fs-dedup
          -p fs-cli
          -p layerfs-win32-host
          --all-targets
          -- -D warnings

      - name: Test Windows adapter, bridge, dedup, and CLI
        run: >
          cargo test
          -p fs-semantics
          -p fs-windows
          -p fs-winfsp
          -p fs-layerfs
          -p fs-cli
          -- --test-threads=1

      - name: Test fs-dedup (non-mount unit, e2e, and regression tests)
        run: >
          cargo test
          -p fs-dedup
          -- --skip live_winfsp_mount --test-threads=1

      - name: Test upstream Windows-adapted core crates
        run: >
          cargo test --tests
          -p layerfs-persistence
          -p layerfs-store-service
          -p layerfs-overlay
          -p layerfs-workspace
          -p layerfs-project

      - name: Build release binaries
        run: cargo build --release -p fs-cli -p fs-dedup
