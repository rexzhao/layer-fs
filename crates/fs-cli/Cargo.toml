[package]
name = "fs-cli"
description = "Command line interface for the Workspace CAS filesystem."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "fs-cli"
path = "src/main.rs"

# The vocabulary lives in a library so the criteria can assert the **same constants** the binary prints (ADR-010 §8.2).
[lib]
name = "fs_cli"
path = "src/lib.rs"

[dependencies]
fs-api.workspace = true
fs-workspace.workspace = true
# The mount subcommands drive the WinFsp frontend directly (B-24); `fs-api` supplies the backend they hand it.
fs-winfsp.workspace = true
# One line of JSON per control request (ADR-010 §10.2); the ruling was the library, not a hand-written parser (547).
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rusqlite.workspace = true

# The control pipe (ADR-010 §10.2): named pipes, the current user's SID for the DACL, and the console handler live behind these.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Console",
] }
