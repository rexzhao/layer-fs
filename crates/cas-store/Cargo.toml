[package]
name = "cas-store"
description = "Persistent content-addressed store: object files, index and crash recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Compiles the crash-point helpers used by this crate's own tests. Off by
# default: a consumer of `cas-store` never gets the abort hooks (ADR-002 §13.1).
crash-points = []
# The publication probe (ADR-008 §5 acceptance): records what a batch did on disk and opens
# rusqlite's `trace` so transaction boundaries come from SQLite, not from our own markers.
# Off by default; a consumer never gets it.
sync-probe = ["rusqlite/trace"]
# Transaction timings only: no `trace`, so the measurement is not polluted by a per-statement
# callback inside the very window it measures (ADR-008 §5 acceptance D).
lock-probe = []
# Diagnostics only (default off): asserts that a pack file exists before its index rows are
# committed, so "index names a missing pack" can be attributed to the write path.
staging-audit = []

[dependencies]
blake3.workspace = true
cas-core.workspace = true
rusqlite.workspace = true

[dev-dependencies]
# Self-reference so `cargo test -p cas-store` compiles the crash-point module.
# Only the crash points: the probe features are opt-in per run so that the lock-hold
# measurement is not polluted by `rusqlite/trace` (see `[[test]]` below).
cas-store = { path = ".", features = ["crash-points"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

# The probe tests need their feature explicitly: `sync-probe` turns on `rusqlite/trace`, whose
# per-statement callback would inflate the very transaction it measures, so `lock-probe` is a
# separate run rather than a default.
[[test]]
name = "sync_probe"
required-features = ["sync-probe"]

[[test]]
name = "lock_hold"
required-features = ["lock-probe"]
