[workspace]
resolver = "2"
members = [
    "crates/cas-core",
    "crates/cas-store",
    "crates/fs-namespace",
    "crates/fs-snapshot",
    "crates/fs-overlay",
    "crates/fs-workspace",
    "crates/fs-api",
    "crates/fs-cli",
    "crates/fs-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cas-core = { path = "crates/cas-core" }
cas-store = { path = "crates/cas-store" }
fs-namespace = { path = "crates/fs-namespace" }
fs-snapshot = { path = "crates/fs-snapshot" }
fs-overlay = { path = "crates/fs-overlay" }
fs-workspace = { path = "crates/fs-workspace" }
fs-api = { path = "crates/fs-api" }
blake3 = "1.8.7"
# Bundled SQLite: one version everywhere, no system-library dependency.
rusqlite = { version = "0.40.2", features = ["bundled"] }
